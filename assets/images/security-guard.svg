<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Security guard photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="6" fill="#f59e0b"/>
  <!-- Guard silhouette -->
  <g transform="translate(400,250)">
    <!-- Cap -->
    <rect x="-55" y="-190" width="110" height="30" rx="6" fill="#f59e0b"/>
    <path d="M-60 -162 L60 -162 L50 -190 L-50 -190 Z" fill="#f59e0b"/>
    <rect x="-55" y="-185" width="110" height="8" fill="#0f172a"/>
    <!-- Head -->
    <circle cx="0" cy="-115" r="42" fill="#ece5db"/>
    <!-- Shoulders + torso -->
    <path d="M-95 -30 Q-90 -85 -45 -80 L45 -80 Q90 -85 95 -30 L130 90 L-130 90 Z" fill="url(#dress)" stroke="#0f172a" stroke-width="4"/>
    <!-- Belt -->
    <rect x="-100" y="20" width="200" height="18" fill="#0f172a"/>
    <rect x="-14" y="18" width="28" height="22" rx="4" fill="#f59e0b"/>
    <!-- Badge -->
    <circle cx="0" cy="-45" r="14" fill="#f59e0b"/>
    <text x="0" y="-40" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="16" fill="#0f172a">V</text>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" fill="rgba(255,255,255,0.7)">
    SECURITY GUARD PHOTO — replace with real image
  </text>
</svg>