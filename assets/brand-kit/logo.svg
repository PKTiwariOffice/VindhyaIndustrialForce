<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Vindhya Industrial Force logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="#0f172a"/>
  <!-- Shield -->
  <path d="M100 30 L140 48 V96 C140 130 122 160 100 172 C78 160 60 130 60 96 V48 Z" fill="url(#shieldFill)" stroke="#f59e0b" stroke-width="5"/>
  <!-- Inner shield line -->
  <path d="M100 46 L132 60 V92 C132 118 118 142 100 152 C82 142 68 118 68 92 V60 Z" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <!-- VIF monogram -->
  <text x="100" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="38" fill="#f59e0b">VIF</text>
</svg>